# Local development stack matching the C4 diagram in spec/statement_of_work.md:
# Web Application (frontend) -> API Application (backend) -> PostgreSQL.
# Postgres itself is hosted on Supabase (shared across the team) rather than
# run as a local container - see .env.example for the connection string.

services:
  backend:
    build:
      context: ../src/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../src/backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      GROQ_API_TOKEN: ${GROQ_API_TOKEN}
      GROQ_API_URL: ${GROQ_API_URL}
      INSTRUCTOR_TOKEN: ${INSTRUCTOR_TOKEN}
    depends_on:
      piston-setup:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../src/frontend
    command: npm run dev -- --host
    volumes:
      - ../src/frontend:/app
      - /app/node_modules
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      - backend

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: piston_api
    privileged: true
    restart: unless-stopped
    ports:
      - "2000:2000"
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec
    environment:
      PISTON_LIMIT_OVERRIDES: '{"python":{"run_timeout":20000}}'

  # One-shot job: installs the Python runtime and the modules listed in
  # piston/requirements.txt into the piston-packages volume, then smoke checks
  # them through the Piston API. The backend waits for it to succeed, so the
  # stack cannot come up with an incomplete sandbox runtime. Reuses the Piston
  # image so pip runs against the same OS the runtime was built for.
  piston-setup:
    image: ghcr.io/engineer-man/piston
    entrypoint: ["python3", "/setup/setup_runtime.py"]
    restart: "no"
    environment:
      PISTON_URL: http://piston:2000
    volumes:
      - piston-packages:/piston/packages
      - ./piston:/setup:ro
    depends_on:
      - piston

volumes:
  piston-packages:
