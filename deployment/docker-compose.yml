# Local development stack matching the C4 diagram in spec/statement_of_work.md:
# Web Application (frontend) -> API Application (backend) -> PostgreSQL.
# Postgres itself is hosted on Supabase (shared across the team) rather than
# run as a local container - see .env.example for the connection string.

services:
  backend:
    build:
      context: ../src/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../src/backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      GROQ_API_TOKEN: ${GROQ_API_TOKEN}
      GROQ_API_URL: ${GROQ_API_URL}

  frontend:
    build:
      context: ../src/frontend
    command: npm run dev -- --host
    volumes:
      - ../src/frontend:/app
      - /app/node_modules
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      - backend

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: piston_api
    privileged: true
    restart: unless-stopped
    ports:
      - "2000:2000"
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec

volumes:
  piston-packages:
