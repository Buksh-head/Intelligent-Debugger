name: Sync to public repo

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Clone private repo
        run: |
          git clone https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Studio3Build-2026s2/team-42-jeff-and-the-lads.git private-repo

      - name: Sync files
        run: |
          rm -rf src
          rm -rf deployment

          cp -r private-repo/src src
          cp -r private-repo/deployment deployment
          cp private-repo/package.json package.json
          cp private-repo/package-lock.json package-lock.json

          rm -rf private-repo

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src deployment package.json package-lock.json

          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "Sync deployment files from private repo"
            git push origin main
          fi
